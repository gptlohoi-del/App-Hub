name: 1. Build APK (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout App-Hub
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Collect pinned and topic-tagged GitHub apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_modules.py
      - name: Build offline Web bundle
        run: npm run build
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Hub-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
