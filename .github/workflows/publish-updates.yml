name: 2. Publish Offline Web OTA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - 'modules.config.json'
      - 'package.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apphub-pages
  cancel-in-progress: false

jobs:
  ota:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout App-Hub
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Collect GitHub PWA modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_modules.py
        - name: Verify shared files for KinhTest2 and TungKinh3
        run: |
          test -f public/modules/kinhtest2/index.html
          test -f public/modules/tungkinh3/index.html
          python3 public/modules/tungkinh3/tests/verify_apphub_shared.py public/modules
      - name: Build bundle
        run: npm run build
      - name: Check differences, create ZIP/manifest
        id: package
        run: python3 scripts/publish_update.py
      - name: Configure Pages
        if: steps.package.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        if: steps.package.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
