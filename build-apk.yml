name: 1. Build APK (Android Release Signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Workflow version check (release-v3)
        run: echo "Running complete release workflow v3"

      - name: Checkout App Hub
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect GitHub PWA modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_modules.py

      - name: Build offline Web bundle
        run: npm run build

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android versionCode and versionName
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('android/app/build.gradle')
          content = path.read_text(encoding='utf-8')
          version = int(os.environ['GITHUB_RUN_NUMBER'])

          content, n_code = re.subn(
              r'(?m)^(\s*versionCode)\s+\d+\s*$',
              lambda match: f'{match.group(1)} {version}',
              content,
              count=1,
          )
          content, n_name = re.subn(
              r'(?m)^(\s*versionName)\s+["\'][^"\']+["\']\s*$',
              lambda match: f'{match.group(1)} "1.0.{version}"',
              content,
              count=1,
          )
          if n_code != 1 or n_name != 1:
              raise RuntimeError('Could not set Android app version in build.gradle')
          path.write_text(content, encoding='utf-8')
          print(f'Android release: versionCode={version}, versionName=1.0.{version}')
          PY

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Sign and verify release APK
        env:
          APPHUB_KEYSTORE_BASE64: ${{ secrets.APPHUB_KEYSTORE_BASE64 }}
          APPHUB_KEYSTORE_PASSWORD: ${{ secrets.APPHUB_KEYSTORE_PASSWORD }}
          APPHUB_KEY_PASSWORD: ${{ secrets.APPHUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for secret_name in APPHUB_KEYSTORE_BASE64 APPHUB_KEYSTORE_PASSWORD APPHUB_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing GitHub Actions Secret: $secret_name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/apphub-release.jks"
          trap 'rm -f "$KEYSTORE_PATH" "$RUNNER_TEMP/apphub-aligned.apk"' EXIT
          printf '%s' "$APPHUB_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo '::error::Android SDK Build Tools were not found.'
            exit 1
          fi
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$UNSIGNED_APK" ]; then
            echo '::error::Unsigned release APK is missing.'
            exit 1
          fi

          mkdir -p signed
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$UNSIGNED_APK" "$RUNNER_TEMP/apphub-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type JKS \
            --ks-key-alias apphub \
            --ks-pass env:APPHUB_KEYSTORE_PASSWORD \
            --key-pass env:APPHUB_KEY_PASSWORD \
            --out signed/App-Hub-release.apk \
            "$RUNNER_TEMP/apphub-aligned.apk"

          "$BUILD_TOOLS/zipalign" -c -P 16 4 signed/App-Hub-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs signed/App-Hub-release.apk
          echo '::notice::APK was signed and verified successfully.'
          ls -lh signed/App-Hub-release.apk

      - name: VERIFY signed APK file before upload
        run: |
          set -euo pipefail
          test -s signed/App-Hub-release.apk || { echo '::error::Signed APK missing or empty'; exit 1; }
          echo 'Signed APK is ready for artifact upload:'
          ls -lh signed/App-Hub-release.apk

      - name: UPLOAD signed release APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: App-Hub-release-APK
          path: signed/App-Hub-release.apk
          if-no-files-found: error
          retention-days: 30
